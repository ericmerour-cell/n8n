name: Combo API introspection

on:
  push:
    paths:
      - '.github/workflows/combo-introspect.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build compact API model map
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          python - <<'PY'
          import json, requests, yaml
          u='https://partner.combohr.com/api-docs/partner/swagger.yaml'
          r=requests.get(u, timeout=30)
          r.raise_for_status()
          spec=yaml.safe_load(r.text)
          schemas=((spec.get('components') or {}).get('schemas') or {})
          keep=[]
          for name in schemas:
            low=name.lower()
            if any(k in low for k in ['planning','contract','location','team','membership','employee','revenue','rest']): keep.append(name)
          def compact(s):
            if not isinstance(s,dict): return s
            out={}
            for k in ['$ref','type','format','description','nullable','example','enum','default','minimum','maximum']:
              if k in s: out[k]=s[k]
            if 'required' in s: out['required']=s['required']
            if 'allOf' in s: out['allOf']=[compact(x) for x in s['allOf']]
            if 'oneOf' in s: out['oneOf']=[compact(x) for x in s['oneOf']]
            if 'items' in s: out['items']=compact(s['items'])
            if 'properties' in s: out['properties']={k:compact(v) for k,v in s['properties'].items()}
            return out
          out={'schema_names':sorted(schemas.keys()),'models':{n:compact(schemas[n]) for n in keep}}
          open('results/combo-models.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/combo-models.json
          git commit -m 'Update compact Combo model map' || true
          git push
