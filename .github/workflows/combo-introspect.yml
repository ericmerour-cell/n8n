name: Combo API introspection

on:
  push:
    paths:
      - '.github/workflows/combo-introspect.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch Swagger specification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          python - <<'PY'
          import json, requests, yaml
          u='https://partner.combohr.com/api-docs/partner/swagger.yaml'
          r=requests.get(u, timeout=30)
          r.raise_for_status()
          open('results/combo-swagger.yaml','w',encoding='utf-8').write(r.text)
          spec=yaml.safe_load(r.text)
          components=(spec.get('components') or {})
          schemas=components.get('schemas') or {}
          selected={}
          for name, schema in schemas.items():
            low=name.lower()
            if any(k in low for k in ['planning','contract','location','team','membership','employee','revenue','rest']):
              selected[name]=schema
          out={
            'openapi':spec.get('openapi'),
            'servers':spec.get('servers'),
            'securitySchemes':components.get('securitySchemes'),
            'globalSecurity':spec.get('security'),
            'paths':{},
            'schemas':selected,
            'schema_names':sorted(schemas.keys()),
          }
          for path, methods in (spec.get('paths') or {}).items():
            out['paths'][path]={}
            for method, op in methods.items():
              if method.lower() not in {'get','post','put','patch','delete'}: continue
              out['paths'][path][method.lower()]={
                'summary':op.get('summary'),
                'description':op.get('description'),
                'parameters':op.get('parameters'),
                'requestBody':op.get('requestBody'),
                'security':op.get('security'),
                'responses':op.get('responses'),
              }
          open('results/combo-summary.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/combo-swagger.yaml results/combo-summary.json
          git commit -m 'Update Combo API schema summary' || true
          git push
