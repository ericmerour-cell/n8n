name: Combo API introspection

on:
  push:
    paths:
      - '.github/workflows/combo-introspect.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch Swagger specification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          python - <<'PY'
          import json, requests, yaml
          u='https://partner.combohr.com/api-docs/partner/swagger.yaml'
          r=requests.get(u, timeout=30)
          r.raise_for_status()
          open('results/combo-swagger.yaml','w',encoding='utf-8').write(r.text)
          spec=yaml.safe_load(r.text)
          out={'openapi':spec.get('openapi'),'swagger':spec.get('swagger'),'servers':spec.get('servers'),'host':spec.get('host'),'basePath':spec.get('basePath'),'schemes':spec.get('schemes'),'securityDefinitions':spec.get('securityDefinitions'),'components_securitySchemes':(spec.get('components') or {}).get('securitySchemes'),'paths':{}}
          for path, methods in (spec.get('paths') or {}).items():
            out['paths'][path]={}
            for method, op in methods.items():
              if method.lower() not in {'get','post','put','patch','delete'}: continue
              out['paths'][path][method.lower()]={
                'summary':op.get('summary'),
                'description':op.get('description'),
                'operationId':op.get('operationId'),
                'parameters':op.get('parameters'),
                'requestBody':op.get('requestBody'),
                'security':op.get('security'),
                'responses':op.get('responses'),
              }
          open('results/combo-paths.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/combo-swagger.yaml results/combo-paths.json
          git commit -m 'Update Combo API specification summary' || true
          git push
